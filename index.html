<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#064b91" />
  <meta name="description" content="سامانه طراحی مدل فروش محصولات کارتخوان توسن تکنو - باندلینگ ورژن ۶" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>باندلینگ ورژن ۶ | توسن تکنو</title>
  <style>
    body{margin:0;background:#fff;font-family:Tahoma,sans-serif;color:#172b3a}
    .boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;line-height:2;font-size:14px}
    .boot button{margin-top:10px;border:0;border-radius:10px;background:#064b91;color:#fff;padding:12px 22px;font:inherit;cursor:pointer}
  </style>
  <script>
    // اگر برنامه بارگذاری نشد، به‌جای صفحه سفید پیام قابل فهم نمایش بده.
    (function () {
      function fail() {
        var r = document.getElementById('root');
        if (!r || r.getAttribute('data-mounted')) return;
        r.innerHTML = '<div class="boot"><div><p>بارگذاری برنامه انجام نشد.<br/>اتصال اینترنت را بررسی کنید و صفحه را دوباره باز کنید.</p><button onclick="location.reload()">بارگذاری دوباره</button></div></div>';
      }
      window.addEventListener('error', function (e) { if (e.target && e.target !== window) fail(); }, true);
      window.addEventListener('unhandledrejection', fail);
      setTimeout(fail, 10000);
    })();
  </script>
</head>
<body>
  <div id="root"><div class="boot">در حال بارگذاری…</div></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
